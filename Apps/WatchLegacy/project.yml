# T-063…T-072 — WatchLegacy app project (design.md §4.1, ADR-002, CON-2).
#
# The Series 3 tier: watchOS 8.0, armv7k. Its own Xcode project, its own bundle identifier, sharing
# nothing with Apps/WatchModern but `Core` (AC-FR-K-1-4, enforced by Tools/check-tier-isolation.sh).
#
# Generated by xcodegen — edit this file and regenerate rather than hand-editing the .xcodeproj.
#
# ## Two targets, not one, and why that is not a style choice
#
# Xcode 14 introduced the single-target watch app, identified by the `WKApplication` Info.plist key.
# **That key is watchOS 9+.** A watchOS 8 device looks for `WKWatchKitApp` and the classic layout: a
# WatchKit app stub (`application.watchapp2`) containing a WatchKit extension
# (`watchkit2-extension`) in `PlugIns/`, with a `_WatchKitStub/WK` binary. Building a single-target
# app with an 8.0 deployment target produces a bundle Series 3 will not launch.
#
# Both layouts were verified to build with Xcode 26.6 before this file was written; this is the one
# that produces the structure watchOS 8 actually recognises.
#
# ## ARCHS, and the load-bearing finding behind it
#
# Series 3 is **armv7k** (32-bit); Series 4 and later are arm64_32. The watchOS 26.5 SDK's
# `SDKSettings.plist` lists `SupportedTargets.watchos.Archs` as `arm64, arm64e, arm64_32` — armv7k is
# *absent*, so Xcode will not build it by default and an unpinned build produces a binary Series 3
# cannot execute.
#
# The toolchain nevertheless still supports it: the compiler accepts `-target armv7k-apple-watchos8.0`,
# the SDK's TBD stubs still carry armv7k slices, and a full SwiftUI + HealthKit + Core link was
# verified to produce `armv7k / minos 8.0`. So ARCHS is pinned explicitly below. This is the single
# most fragile thing in the wave — the day a toolchain drops armv7k for real, this build breaks and
# that is R-1 arriving. See Apps/WatchLegacy/README.md.
name: OptimalRunnerLegacy
options:
  bundleIdPrefix: com.optimalrunner
  deploymentTarget:
    watchOS: "8.0"
  createIntermediateGroups: true

packages:
  Core:
    path: ../../Core
  # This tier's own framework-free logic. A complete duplicate of the role WatchSupport plays for the
  # Modern tier and deliberately NOT a dependency on it (AC-FR-K-1-4). Carries more of the tier than
  # WatchSupport does, because there is no watchOS 8 simulator: `swift test` on the host is this
  # tier's only automated verification.
  LegacySupport:
    path: LegacySupport

targets:
  # The WatchKit app stub. Carries the Info.plist watchOS 8 reads, and the extension inside it.
  OptimalRunnerLegacy:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "8.0"
    sources:
      - path: Resources
        optional: true
    dependencies:
      - target: OptimalRunnerLegacyExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.optimalrunner.legacy.watchkitapp
        PRODUCT_NAME: OptimalRunner
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        WATCHOS_DEPLOYMENT_TARGET: "8.0"
        ARCHS: armv7k
        ONLY_ACTIVE_ARCH: NO
        SKIP_INSTALL: false
        GENERATE_INFOPLIST_FILE: true
        # `WKWatchKitApp`, not `WKApplication` — see the note at the top of this file.
        INFOPLIST_KEY_WKWatchKitApp: true
        # Required, not optional, for this project: on watchOS 6–8 a classic two-target watch app
        # *without* this key is a companion-dependent app, and expects a containing iOS app to be
        # installed alongside it. This project has no iOS companion target by design (ADR-002 keeps the
        # tier deletable), so without this the app is not independently installable on a Series 3.
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: true
        INFOPLIST_KEY_CFBundleDisplayName: OptimalRunner

  # Where all the code lives. On the classic layout the app target is a stub and the extension is the
  # real binary.
  OptimalRunnerLegacyExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "8.0"
    sources:
      - path: Sources
    dependencies:
      - package: Core
        product: ORModels
      - package: Core
        product: ORPace
      - package: Core
        product: ORIntervals
      - package: Core
        product: ORAlerts
      - package: Core
        product: ORStats
      - package: Core
        product: ORColor
      - package: LegacySupport
        product: LegacySupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.optimalrunner.legacy.watchkitapp.extension
        PRODUCT_NAME: OptimalRunnerExtension
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        WATCHOS_DEPLOYMENT_TARGET: "8.0"
        ARCHS: armv7k
        ONLY_ACTIVE_ARCH: NO
        # Swift 6 language mode, verified to compile and link for armv7k with the full Core surface
        # including actors, `async`/`await` and `Sendable`. Concurrency back-deploys to watchOS 6, and
        # Core's manifest now declares a watchOS 8 floor so package targets are not built against the
        # SDK's 4.0 minimum — which is what made this fail before the floor was added.
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.watchkit
        # AC-FR-B-1-6 / design.md §7: haptics and the live workout session must survive backgrounding.
        # "audio" is not about playing sound — it is the documented background mode that keeps a
        # workout's haptic session alive; without it haptics stop the moment the screen sleeps. On this
        # tier that is more visible than on Modern, because the screen sleeps *fully*.
        INFOPLIST_KEY_UIBackgroundModes: workout-processing audio
        # AC-FR-D-1-1 — every usage description explains *why*.
        INFOPLIST_KEY_NSHealthShareUsageDescription: >-
          OptimalRunner reads your heart rate during a run so it can show it on the run screen and
          record it with your workout.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: >-
          OptimalRunner saves each run as a workout in Health, including distance, heart rate, and
          interval segments, so it appears alongside your other activity data.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          OptimalRunner uses your location while you are running to measure your pace and draw your
          route. Location is only used during an active run.
        INFOPLIST_KEY_NSMotionUsageDescription: >-
          OptimalRunner uses the motion coprocessor and barometer to estimate your pace and adjust
          your target for hills, and to keep measuring distance when GPS is unavailable.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false

  # On-device performance validation (T-072). Unhosted, for the same confirmed Xcode limitation the
  # Modern tier documents: a watchOS test bundle cannot resolve the app extension it accompanies, with
  # or without `embed: false`. So this depends on Core and LegacySupport as packages — which resolve
  # fine — and the handful of device queries it needs (screen width) it makes directly through
  # WatchKit rather than through the extension's helpers.
  #
  # This target's numbers are meaningless anywhere but a Series 3. It is deliberately NOT in the
  # scheme's `test` action, so `xcodebuild test` cannot silently "pass" it on a fast machine and
  # create the impression NFR-1/2/3 are covered. Run it explicitly, on the device.
  OptimalRunnerLegacyTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "8.0"
    sources:
      - path: Tests
    dependencies:
      - package: Core
        product: ORModels
      - package: Core
        product: ORPace
      - package: Core
        product: ORIntervals
      - package: LegacySupport
        product: LegacySupport
    settings:
      base:
        SWIFT_VERSION: "6.0"
        ARCHS: armv7k
        ONLY_ACTIVE_ARCH: NO
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  OptimalRunnerLegacy:
    build:
      targets:
        OptimalRunnerLegacy: all
        OptimalRunnerLegacyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OptimalRunnerLegacyTests
    archive:
      config: Release
