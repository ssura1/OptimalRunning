# T-005 — WatchModern app project (design.md §4.1, ADR-002).
#
# Standalone watchOS 26.0+ app — Series 6 and later, SE 2 and later, all Ultra.
# Deliberately its own Xcode project with its own bundle identifier, sharing
# nothing with the Apps/WatchLegacy target but `Core` (ADR-002).
#
# The floor was watchOS 10.0 through Wave 7 and was raised to 26.0 by
# ADR-014 (T-095). Three models fall between the tiers as a result — Series 4,
# Series 5 and SE (1st generation) run watchOS 10 but not watchOS 26, and
# Apps/WatchLegacy is Series 3 only — which the ADR records rather than glosses.
# Note that watchOS 11 would have cost the same three models: 11 and 26 share the
# Series 6 floor, so there is no cheaper step available.
#
# Generated by xcodegen (`xcodegen generate`), not hand-authored — edit this file
# and regenerate rather than hand-editing OptimalRunnerWatch.xcodeproj.
name: OptimalRunnerWatch
options:
  bundleIdPrefix: com.optimalrunner
  deploymentTarget:
    watchOS: "26.0"
  createIntermediateGroups: true

packages:
  Core:
    path: ../../Core
  # Pure Swift, framework-free logic that belongs to this watch tier specifically
  # (distance fusion, sensor-to-Core mapping) but not to Core itself — ADR-001
  # scopes Core to engine judgement logic, not per-tier sensor orchestration. Lives
  # as its own local package, not app-target source, because a real Xcode
  # limitation (confirmed empirically, not assumed) means neither `@testable
  # import OptimalRunnerWatch` nor even a plain `import OptimalRunnerWatch` resolve
  # from the unhosted test target — see the note on OptimalRunnerWatchTests below.
  # A `package:` dependency resolves fine either way, the same as Core does.
  WatchSupport:
    path: WatchSupport

targets:
  OptimalRunnerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
    dependencies:
      - package: Core
        product: ORModels
      - package: Core
        product: ORPace
      - package: Core
        product: ORIntervals
      - package: Core
        product: ORAlerts
      - package: Core
        product: ORStats
      - package: Core
        product: ORColor
      - package: WatchSupport
        product: WatchSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.optimalrunner.watch
        PRODUCT_NAME: OptimalRunner
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Device builds need a signing team; Simulator builds do not, and CI only ever
        # builds for the Simulator. Same treatment as Apps/iPhone/project.yml, and for
        # the same reasons — the team is read from the environment rather than written
        # down, because this repository is public and a Team ID is a personal identifier
        # no other clone can use anyway:
        #
        #     DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen generate
        #
        # Unset, this expands to the literal "${DEVELOPMENT_TEAM}", which Xcode resolves
        # to empty — a Simulator build still succeeds, which is what keeps `apps.yml`
        # green on a runner with no signing identity, and what lets T-099's device build
        # pass `CODE_SIGNING_ALLOWED=NO` without a team at all.
        #
        # This was missing until the first real device install was attempted, at which
        # point the tier had no way to reach a watch. The iPhone target had carried it
        # since Wave 3; nothing generalised it, because nothing had needed to.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: true
        SKIP_INSTALL: false
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
    # Not GENERATE_INFOPLIST_FILE: true here — that flag means "synthesize the
    # plist from build settings, no physical file," which conflicts with the
    # explicit `info.path` below. The test target still needs it; it has no
    # `info.path` of its own.
    info:
      path: Sources/App/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # REQUIRED, and its absence is invisible until a real watch refuses the app.
        #
        # A watchOS 9+ single-target watch app is identified by `WKApplication: true`;
        # the older two-target layout uses `WKWatchKitApp` instead (which is what
        # Apps/WatchLegacy sets, and why design.md §8.1 lists bundle layout as a tier
        # divergence). Without one of the two, `MIInstaller` refuses the bundle with
        # "WatchKit app being installed is missing either the WKWatchKitApp or
        # WKApplication key set to true in its Info.plist" — error 92, InvalidWatchKitApp.
        #
        # This was missing from Wave 2 until the first install onto real hardware, and
        # nothing caught it: the Simulator does not perform the installer's WatchKit
        # verification, and T-099's device build never *installed* what it built. The
        # bundle-layout assertion added alongside this closes that gap, mirroring what
        # legacy.yml has always asserted for its own key.
        WKApplication: true
        # `WKRunsIndependentlyOfCompanionApp` is deliberately ABSENT, and its absence is
        # load-bearing rather than an omission.
        #
        # It was present here, and adding `WKApplication` beside it was assumed harmless.
        # It is not. That key and `WKCompanionAppBundleIdentifier` are both WatchKit 2.0
        # *companion-model* keys, and carrying either sends the bundle down
        # `_validateCompanionAppStateInWatchKitApp`, which then demands the companion
        # bundle identifier the other key would have supplied. The result on a real watch
        # is `MIInstaller` error 97, InvalidCompanionAppBundleIdentifier — a second
        # install refusal immediately after fixing the first.
        #
        # A watchOS 9+ single-target app declared by `WKApplication` has no companion by
        # construction, which is exactly what ADR-002 specifies for this tier: its own
        # bundle identifier, sharing nothing with `Apps/iPhone` but `Core`. Naming a
        # companion would contradict that; declaring independence from a companion that
        # cannot exist is meaningless. So neither key belongs here, and the gate in
        # `apps.yml` asserts both are gone rather than trusting this comment.
        # AC-FR-B-1-6 / design.md §7 "Background delivery": haptics and the live
        # workout session must survive the app being backgrounded. "audio" is not
        # about playing sound — it is the documented, Apple-sanctioned background
        # mode that keeps a workout's audio/haptic session alive; without it,
        # haptics silently stop firing the moment the screen sleeps.
        UIBackgroundModes:
          - workout-processing
          - audio
        # AC-FR-D-1-1 — every usage description explains *why*, matching the
        # authorization-rationale requirement, not a generic template string.
        NSHealthShareUsageDescription: >-
          OptimalRunner reads your heart rate during a run so it can show it on the
          run screen and record it with your workout.
        NSHealthUpdateUsageDescription: >-
          OptimalRunner saves each run as a workout in Health, including distance,
          heart rate, and route, so it appears alongside your other activity data.
        NSLocationWhenInUseUsageDescription: >-
          OptimalRunner uses your location while you are running to measure your
          pace and draw your route. Location is only used during an active run.
        NSMotionUsageDescription: >-
          OptimalRunner uses the motion coprocessor to estimate your pace and
          distance when GPS is unavailable, such as on a treadmill or in a tunnel.
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets:
        - OptimalRunnerWatchTests
      gatherCoverageData: true

  # Unhosted — does not run inside the app's process. A hosted test bundle needs
  # TEST_HOST to resolve to the app's internal executable path, which is unreliable
  # for single-target watchOS apps in this Xcode version; going unhosted sidesteps
  # that rather than fighting it, and is what Xcode's own watchOS App template does
  # by default.
  #
  # Deliberately does NOT depend on the OptimalRunnerWatch target itself — confirmed
  # empirically that neither `@testable import OptimalRunnerWatch` nor even a plain
  # `import OptimalRunnerWatch` resolve here ("Unable to resolve module dependency"),
  # with or without `embed: false`. Real Xcode/watchOS limitation, not a missing
  # setting. Testable logic that would otherwise live in the app target instead
  # lives in the local WatchSupport package (see `packages:` above), which resolves
  # fine as a `package:` dependency, the same way Core does.
  OptimalRunnerWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
    dependencies:
      - package: Core
        product: ORModels
      # EngineOutput, for building the presentation cases this target checks.
      - package: Core
        product: ORPace
      # Palettes and affordances, for the contrast and redundant-encoding checks.
      - package: Core
        product: ORColor
      - package: WatchSupport
        product: WatchSupport
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  OptimalRunnerWatch:
    build:
      targets:
        OptimalRunnerWatch: all
        OptimalRunnerWatchTests: [test]
    test:
      targets:
        - OptimalRunnerWatchTests
