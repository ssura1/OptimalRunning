# T-005 — WatchModern app project (design.md §4.1, ADR-002).
#
# Standalone watchOS 10.0+ app — Series 4 and later. Deliberately its own Xcode
# project with its own bundle identifier, sharing nothing with a future
# Apps/WatchLegacy target but `Core` (ADR-002). Not created in this MVP.
#
# Generated by xcodegen (`xcodegen generate`), not hand-authored — edit this file
# and regenerate rather than hand-editing OptimalRunnerWatch.xcodeproj.
name: OptimalRunnerWatch
options:
  bundleIdPrefix: com.optimalrunner
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  Core:
    path: ../../Core

targets:
  OptimalRunnerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources
    dependencies:
      - package: Core
        product: ORModels
      - package: Core
        product: ORPace
      - package: Core
        product: ORIntervals
      - package: Core
        product: ORAlerts
      - package: Core
        product: ORStats
      - package: Core
        product: ORColor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.optimalrunner.watch
        PRODUCT_NAME: OptimalRunner
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: true
        SKIP_INSTALL: false
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    # Not GENERATE_INFOPLIST_FILE: true here — that flag means "synthesize the
    # plist from build settings, no physical file," which conflicts with the
    # explicit `info.path` below. The test target still needs it; it has no
    # `info.path` of its own.
    info:
      path: Sources/App/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        WKRunsIndependentlyOfCompanionApp: true
        # AC-FR-B-1-6 / design.md §7 "Background delivery": haptics and the live
        # workout session must survive the app being backgrounded. "audio" is not
        # about playing sound — it is the documented, Apple-sanctioned background
        # mode that keeps a workout's audio/haptic session alive; without it,
        # haptics silently stop firing the moment the screen sleeps.
        UIBackgroundModes:
          - workout-processing
          - audio
        # AC-FR-D-1-1 — every usage description explains *why*, matching the
        # authorization-rationale requirement, not a generic template string.
        NSHealthShareUsageDescription: >-
          OptimalRunner reads your heart rate during a run so it can show it on the
          run screen and record it with your workout.
        NSHealthUpdateUsageDescription: >-
          OptimalRunner saves each run as a workout in Health, including distance,
          heart rate, and route, so it appears alongside your other activity data.
        NSLocationWhenInUseUsageDescription: >-
          OptimalRunner uses your location while you are running to measure your
          pace and draw your route. Location is only used during an active run.
        NSMotionUsageDescription: >-
          OptimalRunner uses the motion coprocessor to estimate your pace and
          distance when GPS is unavailable, such as on a treadmill or in a tunnel.
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets:
        - OptimalRunnerWatchTests
      gatherCoverageData: true

  # Unhosted — does not run inside the app's process. A hosted test bundle needs
  # TEST_HOST to resolve to the app's internal executable path, which is unreliable
  # for single-target watchOS apps in this Xcode version; going unhosted sidesteps
  # that rather than fighting it, and is what Xcode's own watchOS App template does
  # by default.
  #
  # Deliberately does NOT depend on the OptimalRunnerWatch target. A link-only,
  # non-embedded dependency was tried and still fails to resolve for `@testable
  # import` under this configuration ("Unable to resolve module dependency") — a
  # real Xcode/watchOS limitation, not a missing setting here. Practical
  # consequence: anything under Apps/WatchModern that needs unit-level testing must
  # be `public`, not `internal` behind `@testable`. See the note in
  # Tests/ScaffoldingTests.swift.
  OptimalRunnerWatchTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Tests
    dependencies:
      - package: Core
        product: ORModels
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  OptimalRunnerWatch:
    build:
      targets:
        OptimalRunnerWatch: all
        OptimalRunnerWatchTests: [test]
    test:
      targets:
        - OptimalRunnerWatchTests
