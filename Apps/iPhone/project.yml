# T-005 — iPhone app project (design.md §4.1, requirements.md §4.1).
#
# Generated by xcodegen (`xcodegen generate`), not hand-authored, so the .xcodeproj
# stays reproducible from a plain-text spec that reviews like any other source file.
# Do not hand-edit OptimalRunner.xcodeproj — edit this file and regenerate.
name: OptimalRunner
options:
  bundleIdPrefix: com.optimalrunner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Core:
    path: ../../Core

targets:
  OptimalRunner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: Core
        product: ORModels
      - package: Core
        product: ORPace
      - package: Core
        product: ORIntervals
      - package: Core
        product: ORAlerts
      - package: Core
        product: ORStats
      - package: Core
        product: ORColor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.optimalrunner.app
        PRODUCT_NAME: OptimalRunner
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"       # iPhone only — no iPad, no Mac Catalyst
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: true
    # Not GENERATE_INFOPLIST_FILE: true here — that flag means "synthesize the
    # plist from build settings, no physical file," which conflicts with the
    # explicit `info.path` below. The test target still needs it; it has no
    # `info.path` of its own.
    info:
      path: Sources/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # AC-FR-D-1-1 — every usage description explains *why*, not just *that*.
        # This is the phone side: it reads workout history to build the statistics
        # hub (design.md §1, IPH in the architecture diagram). It does not write —
        # the watch owns live capture and writes the HKWorkout.
        NSHealthShareUsageDescription: >-
          OptimalRunner reads your past runs from Health so it can show your training
          history, personal bests, and lifetime statistics. Your data is never sent
          anywhere else.
        # NFR-14 — declared for completeness even though this app makes no network
        # calls; check-no-network.sh (NFR-14/15) is what actually enforces it.
        ITSAppUsesNonExemptEncryption: false
    scheme:
      testTargets:
        - OptimalRunnerTests
      gatherCoverageData: true

  OptimalRunnerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: OptimalRunner
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true

schemes:
  OptimalRunner:
    build:
      targets:
        OptimalRunner: all
        OptimalRunnerTests: [test]
    test:
      targets:
        - OptimalRunnerTests
