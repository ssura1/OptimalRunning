# T-005 — iPhone app project (design.md §4.1, requirements.md §4.1).
#
# Generated by xcodegen (`xcodegen generate`), not hand-authored, so the .xcodeproj
# stays reproducible from a plain-text spec that reviews like any other source file.
# Do not hand-edit OptimalRunner.xcodeproj — edit this file and regenerate.
name: OptimalRunner
options:
  bundleIdPrefix: com.optimalrunner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Core:
    path: ../../Core
  # The phone tier's logic — persistence, ingest, backfill, analysis — in a local package so it
  # can be tested with `swift test` on the macOS host rather than only in a simulator. Same
  # reasoning as WatchSupport (ADR-012), for a different cause: on iOS a hosted test target can
  # import the app fine, but this is the code where a bug silently corrupts a run's history, and
  # that deserves a test loop measured in seconds.
  PhoneSupport:
    path: PhoneSupport
  # The standalone tier's motion estimation, as pure arithmetic (standalone ADR-S-03).
  # Separate from PhoneSupport because it has no SwiftData dependency and therefore no
  # macOS 14 floor, which is what lets it run in the fast Linux CI lane alongside Core —
  # and the iOS Simulator has no accelerometer at all (CON-S-1), so a package that can be
  # tested without one is not a convenience here, it is the only verification available.
  PhoneMotion:
    path: PhoneMotion

targets:
  OptimalRunner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: Core
        product: ORModels
      - package: Core
        product: ORPace
      - package: Core
        product: ORIntervals
      - package: Core
        product: ORAlerts
      - package: Core
        product: ORStats
      - package: Core
        product: ORColor
      - package: PhoneSupport
        product: PhoneSupport
      - package: PhoneMotion
        product: PhoneMotion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.optimalrunner.app
        PRODUCT_NAME: OptimalRunner
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"       # iPhone only — no iPad, no Mac Catalyst
        # Device builds need a signing team; Simulator builds do not, and CI only ever
        # builds for the Simulator. The team is therefore read from the environment
        # rather than written down, because this repository is public and a Team ID is
        # a personal identifier that no other clone can use anyway:
        #
        #     DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen generate
        #
        # Unset, this expands to the literal "${DEVELOPMENT_TEAM}", which Xcode resolves
        # to empty — a Simulator build still succeeds, which is what keeps `apps.yml`
        # green on a runner that has no signing identity at all. Both halves of that are
        # verified, not assumed: a Simulator build with the variable unset and a device
        # build with it set were each run before this was committed.
        #
        # Setting the team in Xcode's Signing & Capabilities editor instead also works,
        # but only until the next `xcodegen generate` overwrites the project — which is
        # the whole reason this line exists.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        SWIFT_VERSION: "6.0"
        ENABLE_PREVIEWS: true
    # Not GENERATE_INFOPLIST_FILE: true here — that flag means "synthesize the
    # plist from build settings, no physical file," which conflicts with the
    # explicit `info.path` below. The test target still needs it; it has no
    # `info.path` of its own.
    info:
      path: Sources/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # AC-FR-D-1-1 — every usage description explains *why*, not just *that*.
        # This is the phone side: it reads workout history to build the statistics
        # hub (design.md §1, IPH in the architecture diagram). It does not write —
        # the watch owns live capture and writes the HKWorkout.
        NSHealthShareUsageDescription: >-
          OptimalRunner reads your past runs from Health so it can show your training
          history, personal bests, and lifetime statistics. Your data is never sent
          anywhere else.
        # Added with the standalone tier (S-033). Until then this app only *read* from
        # Health — the watch owned live capture and wrote the HKWorkout. A phone-recorded
        # run has no watch to write it, so the phone does, and iOS requires a separate
        # description for the write half. Its absence is not a warning: `requestAuthorization`
        # traps at runtime without it, on the one path the Simulator does exercise.
        NSHealthUpdateUsageDescription: >-
          OptimalRunner saves runs you record on your phone to Health, with their distance
          and route, so they appear alongside your other workouts. It never writes a heart
          rate, because your phone cannot measure one.
        # NFR-14 — declared for completeness even though this app makes no network
        # calls; check-no-network.sh (NFR-14/15) is what actually enforces it.
        ITSAppUsesNonExemptEncryption: false

        # --- Standalone tier (docs/standalone) ---
        #
        # These keys are *declarations of capability*, not prompts. iOS asks the user at
        # the point of use, and AC-FR-S-A-1-2 requires the request to happen on the first
        # standalone run and nowhere else — a hub-only user who never starts a phone run
        # is never asked for either of these. That laziness is what makes ADR-S-01's
        # "one app, two personalities" decision cost a hub-only user nothing.
        NSMotionUsageDescription: >-
          OptimalRunner reads motion from the phone in your hand to measure your cadence
          and your pace when GPS is weak or unavailable. It stays on your device.
        NSLocationWhenInUseUsageDescription: >-
          OptimalRunner uses GPS to measure your distance and pace during a run, and to
          record your route. Your location is never sent anywhere.
        # CON-S-4 — there is no `workout-processing` background mode on iOS, and no live
        # HKWorkoutSession at this deployment target to hold the process up (CON-S-2), so
        # background execution during a run is earned here or not at all. Omitting either
        # of these produces a run that silently stops recording the moment the screen
        # sleeps, with no error anywhere.
        UIBackgroundModes:
          - location
          - audio
        # FR-S-F-1-7 — captured motion traces are retrievable through the Files app and
        # the share sheet. Retrieval that needs Xcode is retrieval that does not happen on
        # a Sunday morning after a long run.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    scheme:
      testTargets:
        - OptimalRunnerTests
      gatherCoverageData: true

  OptimalRunnerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: OptimalRunner
      - package: Core
        product: ORModels
      - package: Core
        product: ORPace
      - package: Core
        product: ORStats
      - package: PhoneSupport
        product: PhoneSupport
      # The test bundle is the one place both sides of the PhoneMotion boundary are
      # visible, and that is deliberate rather than a leak. `StandaloneBoundaryTests`
      # has to mutate the estimator's configuration and then assert that the run list,
      # the statistics and the live screen move — a test that could not import the
      # estimator could only prove the boundary exists, not that it works.
      # `Tools/check-phonemotion-isolation.sh` exempts tests for exactly this reason and
      # keeps the ban on `Sources`, which is where coupling would cost something.
      - package: PhoneMotion
        product: PhoneMotion
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true

schemes:
  OptimalRunner:
    build:
      targets:
        OptimalRunner: all
        OptimalRunnerTests: [test]
    test:
      targets:
        - OptimalRunnerTests
