name: Legacy (Series 3)

# The watchOS 8 / Series 3 tier (Wave 4, CON-2, AC-FR-K-1-2).
#
# Deferred from T-006 (Wave 0) because it had nothing to build against until Apps/WatchLegacy existed.
#
# ## Why the Xcode version is pinned
#
# CON-2: the Series 3 build window is closing. This target needs two things a future toolchain will
# eventually stop providing — a watchOS 8.0 deployment target, and the **armv7k** architecture, which
# the watchOS 26.5 SDK already omits from `SupportedTargets.watchos.Archs` while still shipping the
# stub slices that make it link.
#
# So this job is pinned deliberately, and **its failure is a designed signal rather than a surprise**:
# when runners no longer carry Xcode 26, or when Xcode 26 stops building armv7k, that is
# R-1 arriving and the planned response is to delete Apps/WatchLegacy and this file
# (see docs/requirements.md §11 and Tools/manual-test-protocol.md §0.3).
#
# The pin is **two** values, not one: `runs-on` and `xcode-version`. A given runner image carries only
# a fixed set of Xcode versions, so the label is part of the pin — `macos-15` tops out at Xcode 26.3
# and cannot satisfy this job at all. Change one and you must re-check the other against
# https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md.
#
# ## What this job can and cannot verify
#
# It builds, and it runs the tier's logic tests. It does **not** run a simulator, because there is no
# watchOS 8 simulator runtime for Xcode 26 — the only installed watchOS runtime is 26.5. That is not a
# gap in this workflow; it is the reason `LegacySupport` carries as much of the tier as it does, and
# the reason Tools/manual-test-protocol.md is as long as it is.
on:
  push:
  pull_request:

jobs:
  # The tier's logic — sensor fusion, the run controller, presentation, transport, and the
  # AC-FR-K-1-2 fixture replay against the shared goldens.
  #
  # This is the job that matters. It runs on the macOS host with no simulator, which is the only
  # automated verification this tier can have.
  legacy-support:
    name: LegacySupport (tier logic + equivalence)
    # Deliberately *not* pinned, unlike legacy-build below. This job builds nothing for armv7k and
    # nothing for watchOS 8 — it is pure host-side logic, so it has no stake in the SDK. Letting it
    # float is worth something: it currently runs on a different Swift toolchain than the pinned build
    # job, so the whole-`EngineGolden` equality in TierEquivalenceTests passing here is evidence those
    # goldens are not an artefact of one specific compiler.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Reads the shared Fixtures/ directory at the repository root — the same seven fixtures and the
      # same seven goldens Core and the Modern tier read. That shared reading is what makes tier
      # equivalence meaningful rather than a parallel set of expectations.
      - name: Test
        run: swift test --package-path Apps/WatchLegacy/LegacySupport

  # The watchOS 8 build, for armv7k.
  #
  # No `test` action: the only test target here is T-072's performance suite, whose numbers are
  # meaningless off-device. Running it on a fast macOS runner would report success for the wrong
  # reason and create the impression NFR-1/2/3 are covered when they are not.
  legacy-build:
    name: Watch Legacy (watchOS 8, armv7k)
    # macos-26, not macos-15: the Xcode 26.6 pin below is only available on this image (macos-15 stops
    # at 26.3). See the two-value pin note at the top of this file.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Fixed at 26.6, NOT latest-stable: this is the exact Xcode whose watchOS 26.5 SDK was verified to
      # still link armv7k even though it omits armv7k from SupportedTargets.watchos.Archs. Bumping this
      # must be a deliberate act with a re-verified `lipo -archs`, never a drive-by "keep it current".
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # `xcode-version: '26.6'` is a version *spec*, not a build. It would silently accept a future
      # 26.6.1 image refresh — which is the drift the pin exists to prevent. So the resolved toolchain is
      # asserted down to the build number that was actually verified.
      - name: Assert the pin resolved to the verified toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          VER=$(xcodebuild -version | awk 'NR==1 {print $2}')
          BUILD=$(xcodebuild -version | awk 'NR==2 {print $3}')
          if [ "$VER" != "26.6" ] || [ "$BUILD" != "17F113" ]; then
            echo "::error::expected Xcode 26.6 (17F113), got $VER ($BUILD) — armv7k support is not re-verified for this toolchain (CON-2, R-1)"
            exit 1
          fi
          # The armv7k link depends on this SDK's stub slices, so it is asserted too, not just Xcode.
          SDK=$(xcodebuild -showsdks | awk '/-sdk watchos[0-9]/ {print $NF; exit}')
          echo "watchOS SDK: $SDK"
          if [ "$SDK" != "watchos26.5" ]; then
            echo "::error::expected the watchos26.5 SDK, got $SDK (CON-2, R-1)"
            exit 1
          fi
          echo "ok: Xcode 26.6 (17F113) / watchos26.5"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: cd Apps/WatchLegacy && xcodegen generate

      # An explicit -derivedDataPath, so the assertion below inspects *this* build. The previous version
      # globbed ~/Library/Developer/Xcode/DerivedData and took `head -1`, which can pick up a stale or
      # unrelated binary — an assertion that might be reading the wrong file proves nothing.
      - name: Build for watchOS 8 / armv7k
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Apps/WatchLegacy/OptimalRunnerLegacy.xcodeproj \
            -scheme OptimalRunnerLegacy \
            -destination 'generic/platform=watchOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO

      # A successful build is not proof the artifact runs on a Series 3: if ARCHS silently resolved to
      # arm64_32, the build would still succeed and the app would install on a Series 4+ while failing
      # on the only hardware this tier exists for. Same for the bundle layout — a single-target watch app
      # builds cleanly and then refuses to launch on watchOS 8. Both are invisible until someone tries it
      # on the watch, which makes them exactly the invariants CI should own rather than a manual protocol.
      - name: Verify the binary is armv7k / watchOS 8
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -name 'OptimalRunner.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::could not locate the built OptimalRunner.app under the derived data path"
            exit 1
          fi
          echo "app: $APP"

          EXT="$APP/PlugIns/OptimalRunnerExtension.appex/OptimalRunnerExtension"
          if [ ! -f "$EXT" ]; then
            echo "::error::no extension binary at PlugIns/OptimalRunnerExtension.appex — the classic two-target watchOS 8 layout is gone (see Apps/WatchLegacy/project.yml)"
            exit 1
          fi

          # watchOS 8 looks for WKWatchKitApp and the WatchKit stub; WKApplication is watchOS 9+.
          if [ ! -f "$APP/_WatchKitStub/WK" ]; then
            echo "::error::no _WatchKitStub/WK in the app bundle — Series 3 will not launch this"
            exit 1
          fi
          if ! plutil -extract WKWatchKitApp raw "$APP/Info.plist" >/dev/null 2>&1; then
            echo "::error::Info.plist has no WKWatchKitApp key — a watchOS 9+ single-target bundle will not launch on Series 3"
            exit 1
          fi
          # There is no iOS companion target in this project, so the app must declare independence or
          # watchOS 8 treats it as needing a containing app that does not exist.
          if [ "$(plutil -extract WKRunsIndependentlyOfCompanionApp raw "$APP/Info.plist" 2>/dev/null)" != "true" ]; then
            echo "::error::WKRunsIndependentlyOfCompanionApp is not true — the app is not independently installable on a Series 3"
            exit 1
          fi

          ARCHS=$(lipo -archs "$EXT")
          echo "archs: $ARCHS"
          if [ "$ARCHS" != "armv7k" ]; then
            echo "::error::built '$ARCHS', not armv7k — this will not run on a Series 3 (CON-2)"
            exit 1
          fi

          # `$1 == "minos"`, not `/minos/`: otool -l prints the file path as its first line and emits
          # `path ...` lines for load commands, so a substring match can hit those instead of the real
          # field and yield an empty version. Anchoring on the field name makes this path-independent.
          MINOS=$(otool -l "$EXT" | awk '$1 == "minos" {print $2; exit}')
          if [ -z "$MINOS" ]; then
            echo "::error::could not read a minos version from $EXT"
            exit 1
          fi
          echo "minos: $MINOS"
          if [ "$MINOS" != "8.0" ]; then
            echo "::error::minimum OS is $MINOS, not 8.0 — Series 3 cannot install this"
            exit 1
          fi
          echo "ok: armv7k / watchOS 8.0 / classic two-target layout"
