name: Apps

# Simulator builds and tests for the iPhone and Modern watch projects (T-006).
#
# The simulator destination is resolved at runtime rather than hardcoded to a
# specific device+OS pair. GitHub's macos-15 runner image's exact bundled
# simulators change over time as Apple/GitHub update Xcode, and pinning a pair
# that happens to be missing fails the whole job with "no matching destination" —
# which is exactly what happened locally against this same device name (Apple
# Watch Series 9) when only Series 11 simulators were actually provisioned.
# Picking whatever's installed for the right platform is more robust than betting
# on a specific model surviving the runner's next image update.
on:
  push:
  pull_request:

jobs:
  # The Modern watch tier's logic — sensor fusion, the run controller, the presentation
  # models, and the AC-FR-K-1-2 tier-equivalence replay — lives in a local Swift package
  # so it can be tested without a simulator.
  #
  # Not folded into core.yml because it is not Core: keeping the boundary visible in CI
  # mirrors ADR-001's boundary in the source tree.
  #
  # On macOS rather than Linux, unlike core.yml, and the reason is `@Observable`. The
  # view models carry the Observation macro, which is why the package declares a macOS 14
  # floor; whether Observation resolves under the Linux toolchain was not verified, and a
  # Linux job asserting it would be a guess. Core keeps the fast Linux lane — it is the
  # package that genuinely has no platform dependency. Revisit if this job's queue time
  # becomes the bottleneck.
  watch-support:
    name: WatchSupport (tier logic)
    # macos-26, not macos-15, and this is a hard requirement rather than a preference.
    # ADR-014 puts this package's floor at watchOS 26, which can only be spelled by a
    # manifest at swift-tools-version 6.2 — and the `macos-15` image's *default* Xcode is
    # 16.4 (Swift 6.1), which cannot parse the manifest at all. The failure is at package
    # resolution, before a single test runs.
    #
    # `macos-26`'s default is Xcode 26.6, the same toolchain legacy.yml pins and the same
    # one this was developed against. No `setup-xcode` step is needed because the image
    # default already satisfies the floor; the step below asserts that rather than
    # assuming it, because "the default is new enough" is exactly the kind of thing that
    # silently stops being true on an image refresh.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Assert the toolchain can express the watchOS 26 floor (ADR-014)
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK=$(xcodebuild -showsdks | awk '/-sdk watchos[0-9]/ {print $NF; exit}')
          echo "watchOS SDK: $SDK"
          MAJOR=$(printf '%s' "$SDK" | sed -E 's/^watchos([0-9]+).*/\1/')
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt 26 ]; then
            echo "::error::watchOS SDK is $SDK; ADR-014 needs 26 or newer. The runner image's default Xcode has regressed below this tier's floor."
            exit 1
          fi
          echo "ok: watchOS SDK major $MAJOR >= 26"

      # Reads the shared Fixtures/ directory at the repository root, the same files
      # Core's own goldens use — that shared reading is what makes tier equivalence
      # meaningful rather than a parallel set of expectations.
      - name: Test
        run: swift test --package-path Apps/WatchModern/WatchSupport

  # The iPhone tier's logic — persistence, ingest, backfill and analysis. Same reasoning as the
  # WatchSupport job: this is where a bug silently corrupts a run's history rather than showing a
  # wrong number, so it gets its own fast signal separate from the simulator build.
  #
  # macOS rather than Linux because SwiftData needs the Apple runtime — there is no Linux option
  # here at all, unlike Core.
  phone-support:
    name: PhoneSupport (tier logic)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test --package-path Apps/iPhone/PhoneSupport

  build:
    name: ${{ matrix.name }}
    # Per-entry, because the two tiers no longer want the same toolchain. The iPhone
    # target is iOS 17+ and builds fine on the cheaper, more available image; the watch
    # target is watchOS 26+ (ADR-014) and does not build on `macos-15` at all, whose
    # default Xcode 16.4 carries a watchOS 11 SDK. Splitting the runner is the honest
    # encoding of that: one tier's floor moved and the other's did not.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone (iOS 17+)
            runner: macos-15
            project: Apps/iPhone/OptimalRunner.xcodeproj
            scheme: OptimalRunner
            simctlPlatform: iOS
            deviceNameFilter: 'iPhone'
            watchOSFloor: ''
          - name: Watch Modern (watchOS 26+)
            runner: macos-26
            project: Apps/WatchModern/OptimalRunnerWatch.xcodeproj
            scheme: OptimalRunnerWatch
            simctlPlatform: watchOS
            deviceNameFilter: 'Watch'
            watchOSFloor: '26'
    steps:
      - uses: actions/checkout@v4

      # A gate, not a promise, and deliberately looser than legacy.yml's exact-build pin.
      # That job pins Xcode to 26.6 (17F113) because armv7k linkage is a fragile property
      # of one specific SDK. This tier needs only "the SDK is new enough to compile my
      # deployment target", so it asserts the SDK's major version and the project's
      # declared floor. A pin tight enough to break on every routine image refresh is a
      # pin that gets deleted, and a deleted pin catches nothing.
      - name: Assert the SDK and the declared floor agree (ADR-014)
        if: matrix.watchOSFloor != ''
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK=$(xcodebuild -showsdks | awk '/-sdk watchos[0-9]/ {print $NF; exit}')
          MAJOR=$(printf '%s' "$SDK" | sed -E 's/^watchos([0-9]+).*/\1/')
          echo "watchOS SDK: $SDK (major $MAJOR)"
          if [ -z "$MAJOR" ] || [ "$MAJOR" -lt "${{ matrix.watchOSFloor }}" ]; then
            echo "::error::watchOS SDK $SDK cannot build a watchOS ${{ matrix.watchOSFloor }} deployment target."
            exit 1
          fi
          # The other half: the project must still *declare* the floor. Without this the
          # SDK check passes happily while someone has quietly dropped the target back to
          # watchOS 10 to make something compile.
          DEPLOY=$(xcodebuild -showBuildSettings \
            -project "${{ matrix.project }}" -scheme "${{ matrix.scheme }}" 2>/dev/null \
            | awk -F' = ' '/ WATCHOS_DEPLOYMENT_TARGET / {print $2; exit}')
          echo "declared WATCHOS_DEPLOYMENT_TARGET: $DEPLOY"
          DEPLOY_MAJOR=$(printf '%s' "$DEPLOY" | cut -d. -f1)
          if [ -z "$DEPLOY_MAJOR" ] || [ "$DEPLOY_MAJOR" -lt "${{ matrix.watchOSFloor }}" ]; then
            echo "::error::WATCHOS_DEPLOYMENT_TARGET is $DEPLOY, below the ADR-014 floor of ${{ matrix.watchOSFloor }}.0. Raising it back is a deliberate act; lowering it silently is what this gate exists to stop."
            exit 1
          fi
          echo "ok: SDK $SDK builds a declared floor of $DEPLOY"

      - name: Resolve an available simulator
        id: sim
        run: |
          set -euo pipefail
          # First available device + runtime matching the platform, from simctl's
          # own JSON — no assumption about which model or OS version is present.
          RESULT=$(xcrun simctl list devices available -j \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          platform = "${{ matrix.simctlPlatform }}"
          name_filter = "${{ matrix.deviceNameFilter }}"
          for runtime, devices in data["devices"].items():
              if platform not in runtime:
                  continue
              for device in devices:
                  if name_filter in device["name"] and device.get("isAvailable", True):
                      print(device["name"])
                      sys.exit(0)
          sys.exit(1)
          ')
          echo "device=$RESULT" >> "$GITHUB_OUTPUT"
          echo "Resolved simulator: $RESULT"

      - name: Build and test
        run: |
          xcodebuild test \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -destination "platform=${{ matrix.simctlPlatform }} Simulator,name=${{ steps.sim.outputs.device }}"

      # T-099. The step above builds for the *simulator*, which on an Apple Silicon
      # runner is a single arm64 slice and therefore says nothing about what will
      # install on a watch. This builds for a device and asserts the slices.
      #
      # Since ADR-014 the supported range spans two architectures for the first time:
      # Series 6, 7, 8 and SE (2nd generation) are arm64_32, while Series 9 and later,
      # SE 3 and Ultra 2 and later are arm64. A wrong ARCHS produces an app that
      # installs perfectly on the developer's own SE 3 and cannot install on a Series 7
      # — invisible until someone with the other watch tries it, which is precisely the
      # class of failure legacy.yml already gates with `lipo -archs` for armv7k.
      #
      # No signing: a device *build* needs none, and requiring a team here would make
      # this gate un-runnable on a fork.
      - name: Both watch architectures ship (T-099)
        if: matrix.watchOSFloor != ''
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "${{ matrix.project }}" \
            -scheme "${{ matrix.scheme }}" \
            -destination 'generic/platform=watchOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-watch" \
            CODE_SIGNING_ALLOWED=NO
          APP=$(find "$RUNNER_TEMP/dd-watch/Build/Products" -maxdepth 2 -name 'OptimalRunner.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::could not locate the built OptimalRunner.app"
            exit 1
          fi
          ARCHS=$(lipo -archs "$APP/OptimalRunner")
          echo "archs: $ARCHS"
          for want in arm64_32 arm64; do
            case " $ARCHS " in
              *" $want "*) ;;
              *) echo "::error::built '$ARCHS' — missing $want. arm64_32 covers Series 6/7/8 and SE 2; arm64 covers Series 9+, SE 3 and Ultra 2+. Both are inside the ADR-014 floor, so both must ship."; exit 1 ;;
            esac
          done
          # The deployment target again, this time as the linker actually recorded it
          # rather than as the project claims it. The earlier check reads build
          # settings; this reads the binary.
          MINOS=$(otool -l "$APP/OptimalRunner" | awk '$1 == "minos" {print $2; exit}')
          echo "minos: $MINOS"
          MINOS_MAJOR=$(printf '%s' "$MINOS" | cut -d. -f1)
          if [ -z "$MINOS_MAJOR" ] || [ "$MINOS_MAJOR" -lt "${{ matrix.watchOSFloor }}" ]; then
            echo "::error::binary minos is $MINOS, below the ADR-014 floor of ${{ matrix.watchOSFloor }}.0"
            exit 1
          fi
          echo "ok: $ARCHS / minos $MINOS"
