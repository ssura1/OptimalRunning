name: Gates

# Structural invariants that are cheap to check and expensive to lose. Each of these
# encodes a decision that would otherwise erode one well-intentioned commit at a time.
on:
  push:
  pull_request:

jobs:
  gates:
    name: Architecture and privacy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Covers Core and Apps/iPhone/PhoneMotion — the two packages whose value depends on
      # being framework-free (ADR-001, ADR-S-03).
      - name: Pure packages import no Apple frameworks (ADR-001, ADR-S-03)
        run: Tools/check-core-imports.sh

      # The standalone track's central honesty rule, made mechanical: a synthetic motion
      # signal may prove a structural property but may never back an accuracy claim
      # (CON-S-7, AC-FR-S-F-3-4).
      - name: No synthetic signal backs an accuracy claim (CON-S-7)
        run: Tools/check-motion-fixtures.sh

      # A sensor callback that inherits @MainActor isolation traps the moment the
      # framework delivers it off the main queue — and never before, because the
      # Simulator has no sensors to deliver (CON-S-1). This crashed five field
      # captures and was latent in both watch tiers besides (S-057).
      - name: Sensor callbacks are explicitly @Sendable (S-057, CON-S-1)
        run: Tools/check-sensor-handler-isolation.sh

      # The same shape of defect as the one above, found the same way — on hardware, after
      # the code had been "working" in CI for months. CoreLocation kills the process when
      # `allowsBackgroundLocationUpdates` is set without the matching background mode
      # declared, and both watch tiers shipped exactly that. Neither watch `LiveSensorFeed`
      # is reachable from a test, so only a gate over the source can hold this.
      - name: Setting background location updates declares the mode (AC-FR-B-1-6, CON-S-4)
        run: Tools/check-location-background-mode.sh

      # Every component of watch→phone sync was written, tested and correct, and none of it
      # ran, because nothing in the app constructed any of it. A finished run deleted its
      # own samples and stopped there — silently, with 180 tests green either side of a
      # pipeline that had no middle. Unit tests structurally cannot catch "the parts work
      # and the assembly does not exist", so the assembly is checked here (T-106).
      - name: A finished run reaches the sync pipeline (FR-E-1, T-106)
        run: Tools/check-sync-wiring.sh

      # ADR-S-01's claim is that the standalone UI depends on Core's output and never on
      # how that output was obtained. S-063 (a measured exponent), S-064 (a calibration
      # over-read) and ADR-S-06 amendment 2 (a gyroscope term) are all queued changes to
      # the estimator, and every one of them should be a one-package change. This is what
      # keeps that true after the fifth screen is written.
      - name: Only the sensor-feed adapter depends on PhoneMotion (ADR-S-01)
        run: Tools/check-phonemotion-isolation.sh

      - name: No availability conditionals in watch targets (CON-3, AC-FR-K-1-5)
        run: Tools/check-no-availability.sh

      - name: No networking or telemetry (NFR-14, NFR-15)
        run: Tools/check-no-network.sh

  traceability:
    name: Requirements trace to tasks
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Every P0 requirement has a covering task
        run: swift Tools/check-traceability.swift
